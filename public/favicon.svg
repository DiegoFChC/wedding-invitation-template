<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Wedding favicon: wax seal with the couple's monogram on deep navy -->
  <defs>
    <radialGradient id="seal" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#efd68a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a97e1c"/>
    </radialGradient>
  </defs>

  <!-- Deep navy background -->
  <rect width="64" height="64" rx="14" fill="#071427"/>

  <!-- Thin gold ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#c9a227" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Wax seal -->
  <circle cx="32" cy="33" r="17" fill="url(#seal)"/>
  <circle cx="32" cy="33" r="13.2" fill="none" stroke="#7a580a" stroke-opacity="0.55" stroke-width="1"/>

  <!-- Monogram -->
  <text x="32" y="37.8" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="12.5" font-weight="700" letter-spacing="0.5"
        fill="#5b4008">S&#183;M</text>
</svg>
